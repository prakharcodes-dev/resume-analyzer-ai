# Server Port (Dynamic Render PORT with local 8080 fallback)
server.port=${PORT:8080}


# Database Configuration (H2 in MySQL compatibility mode)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./resume_analyzer;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.http.converters.preferred-json-mapper=jackson2

# File Upload Configurations
# Set max file size to 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Enable SQL initialization to run schema.sql on startup
spring.sql.init.mode=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
app.recruiter-registration-key=${RECRUITER_REGISTRATION_KEY:}
app.upload-dir=${UPLOAD_DIR:./data/uploads}
